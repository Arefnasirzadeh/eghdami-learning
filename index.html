    <link rel="stylesheet" href="hark.css" />
    <style>
/* English Coach app shell. Every value comes from Hark tokens. */
body { overflow: hidden; }
.x-app { --x-fa: "Geist", "Vazirmatn", var(--sans); font-family: var(--x-fa); height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.x-app button, .x-app input { font-family: inherit; }
[dir="ltr"], .x-en { direction: ltr; unicode-bidi: isolate; }
.x-en { font-family: "Geist", var(--sans); }

/* top bar */
.x-top { display: flex; align-items: center; gap: 8px; padding: 10px var(--gutter); border-bottom: 1px solid var(--stroke-secondary); }
.x-top h1 { flex: 1; font: var(--type-heading); font-family: inherit; }
.x-icon { min-width: var(--tap); min-height: var(--tap); display: inline-grid; place-items: center; border: 1px solid var(--stroke-primary); border-radius: var(--r-pill); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-body); cursor: pointer; padding: 0 12px; }
.x-icon:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }

/* screen */
.x-screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 20px var(--gutter) 32px; display: grid; align-content: start; gap: 20px; }
.x-h2 { font: var(--type-title); font-family: inherit; }
.x-muted { color: var(--text-secondary); font: var(--type-small); font-family: inherit; }
.x-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.x-row--between { justify-content: space-between; }

/* tab bar */
.x-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--stroke-primary); background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); padding-bottom: env(safe-area-inset-bottom); }
.x-tab { display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: 8px 2px; border: 0; background: none; color: var(--text-secondary); font: var(--type-caption); font-family: inherit; cursor: pointer; position: relative; }
.x-tab b { font-size: 20px; line-height: 1; font-weight: var(--weight-regular); }
.x-tab[aria-current="page"] { color: var(--text-primary); font-weight: var(--weight-medium); }
.x-tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; inset-inline: 25%; height: 2px; border-radius: 2px; background: var(--fill-primary); }
.x-tab:disabled { cursor: default; opacity: 0.55; }
.x-tab small { font-size: 10.5px; line-height: 1; }
.x-tab:disabled small { font-size: var(--size-caption); }

/* tiles and list items */
.x-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.x-tile, .x-item { display: grid; gap: 4px; text-align: start; padding: 16px; border: 0; border-radius: var(--r-m); background: var(--fill-tertiary); color: var(--text-primary); font: var(--type-body); font-family: inherit; cursor: pointer; transition: transform var(--dur-quick) var(--ease-out); }
.x-tile:active, .x-item:active { transform: scale(0.98); }
.x-tile b { font-size: 24px; font-weight: var(--weight-regular); }
.x-tile strong, .x-item strong { font-weight: var(--weight-medium); }
.x-tile:disabled { cursor: default; opacity: 0.55; }
.x-list { display: grid; gap: 10px; }

/* segmented filter */
.x-seg { display: flex; gap: 6px; overflow-x: auto; }
.x-seg button { min-height: var(--tap); padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); font-family: inherit; cursor: pointer; white-space: nowrap; }
.x-seg button[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }

/* primary action */
.x-primary { min-height: 48px; padding: 0 22px; border: 0; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-body-strong); font-family: inherit; cursor: pointer; }
.x-primary:disabled { opacity: 0.5; }
.x-sec { min-height: var(--tap); padding: 0 16px; border: 1px solid var(--stroke-primary); border-radius: var(--r-pill); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); font-family: inherit; cursor: pointer; }
.x-sec[aria-pressed="true"] { background: var(--fill-tertiary); border-color: transparent; }

/* story reader */
.x-sents { display: grid; gap: 4px; }
.x-sent { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--r-s); border: 0; background: none; text-align: left; color: var(--text-primary); font: var(--type-body); font-size: var(--size-prose); cursor: pointer; }
.x-sent .x-fa { direction: rtl; text-align: right; font-family: var(--x-fa); color: var(--text-secondary); font-size: var(--size-small); }
.x-sent.is-on { background: var(--fill-tertiary); box-shadow: inset 3px 0 0 var(--fill-system-orange); }
.x-hide .x-sent .x-en { filter: blur(6px); }
.x-hide .x-sent.is-on .x-en { filter: blur(6px); }
.x-sub { padding: 12px var(--gutter); background: var(--mat-inverse); color: var(--text-primary-on); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); font: var(--type-body-strong); text-align: center; min-height: 48px; }
.x-sub:empty { display: none; }

/* quiz */
.x-q { display: grid; gap: 8px; padding: 16px; border-radius: var(--r-m); background: var(--fill-tertiary); }
.x-opt { min-height: var(--tap); padding: 8px 14px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-body); text-align: left; cursor: pointer; }
.x-opt.is-ok { border-color: var(--fill-system-green); box-shadow: inset 0 0 0 1px var(--fill-system-green); }
.x-opt.is-bad { border-color: var(--fill-system-red); box-shadow: inset 0 0 0 1px var(--fill-system-red); }
.x-opt:disabled { cursor: default; }
.x-opt.is-pick { background: var(--fill-primary); color: var(--text-primary-on); }

/* shadowing */
.x-card { display: grid; gap: 16px; padding: 20px; border-radius: var(--r-l); background: var(--fill-tertiary); }
.x-big { font: var(--type-heading); font-size: 22px; }
.x-mic { justify-self: center; width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--fill-primary); color: var(--text-primary-on); font-size: 40px; cursor: pointer; transition: transform var(--dur-quick) var(--ease-out); }
.x-mic.is-live { background: var(--fill-system-red); animation: x-pulse 1.2s infinite; }
@keyframes x-pulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .x-mic.is-live { animation: none; } }
.x-type { display: grid; gap: 8px; }
.x-type input { min-height: var(--tap); padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-body); }

/* diff */
.x-diff { display: flex; flex-wrap: wrap; gap: 6px 8px; font: var(--type-body-strong); font-size: 18px; }
.x-w { display: inline-grid; justify-items: center; }
.x-w.ok { color: var(--fill-system-green); }
.x-w.bad { color: var(--fill-system-red); text-decoration: underline; text-underline-offset: 4px; }
.x-w.miss { color: var(--fill-system-red); text-decoration: line-through; opacity: 0.8; }
.x-w.extra { color: var(--fill-system-orange); font-style: italic; }
.x-w small { font: var(--type-caption); color: var(--text-secondary); }
.x-acc { font: var(--type-display); font-family: inherit; }

/* progress */
.x-bar { height: 6px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
.x-bar i { display: block; height: 100%; background: var(--fill-primary); transition: width var(--dur-quick) var(--ease-out); }

/* settings sheet */
.x-sheet { position: fixed; inset: 0; display: grid; align-items: end; background: rgb(0 0 0 / 0.35); z-index: 50; }
.x-sheet[hidden] { display: none; }
.x-sheet__body { max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 16px; padding: 20px var(--gutter) calc(24px + env(safe-area-inset-bottom)); border-radius: var(--r-l) var(--r-l) 0 0; background: var(--fill-primary-on); box-shadow: var(--hark-shadow); }
.x-sheet input[type="range"] { width: 100%; accent-color: var(--text-primary); min-height: var(--tap); }

/* toast */
.x-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); font-family: inherit; z-index: 60; pointer-events: none; }
.x-toast:empty { display: none; }

/* 504 words */
.x-word { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--r-m); background: var(--fill-tertiary); }
.x-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.x-opt--fa { text-align: start; font-family: var(--x-fa); }
.x-flash { display: grid; min-height: 220px; padding: 0; border: 0; background: none; perspective: 900px; cursor: pointer; color: var(--text-primary); font-family: inherit; }
.x-flash__front, .x-flash__back { grid-area: 1 / 1; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; border-radius: var(--r-l); background: var(--fill-tertiary); text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform var(--dur-draw) var(--ease-out); }
.x-flash__back { transform: rotateY(180deg); }
.x-flash.is-flipped .x-flash__front { transform: rotateY(-180deg); }
.x-flash.is-flipped .x-flash__back { transform: rotateY(0); }
@media (prefers-reduced-motion: reduce) { .x-flash__front, .x-flash__back { transition: none; } }

/* phase 3: headings, bookmarks, podcast, recorder */
.x-h3 { font: var(--type-heading); font-family: inherit; }
.x-mark { display: flex; gap: 8px; align-items: center; }
.x-mark .x-sec { flex: none; }
.x-mark .x-input { flex: 1; min-width: 0; font-family: var(--x-fa); }
.x-who { font: var(--type-caption); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
.x-hide .x-sent .x-who { filter: none; }
.x-rec { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r-m); border: 1px solid var(--stroke-secondary); background: var(--fill-primary-on); }
.x-sec:disabled { opacity: 0.5; cursor: default; }
.x-sec.is-live { background: var(--fill-system-red); color: var(--text-primary-on); border-color: transparent; }
.x-item .chip { font-family: var(--x-fa); }

/* conversation */
.x-seg--wrap { flex-wrap: wrap; overflow: visible; }
.x-chat { display: grid; gap: 10px; }
.x-chat:empty { display: none; }
.x-msg { max-width: 85%; display: flex; align-items: flex-start; gap: 6px; padding: 10px 14px; border-radius: var(--r-m); font: var(--type-body); font-size: var(--size-prose); }
.x-msg p { flex: 1; padding-top: 2px; }
.x-msg .x-icon { min-width: 36px; min-height: 36px; padding: 0 8px; border: 0; background: none; }
.x-msg.is-bot { justify-self: end; background: var(--fill-tertiary); border-end-end-radius: 4px; }
.x-msg.is-me { justify-self: start; background: var(--fill-primary); color: var(--text-primary-on); border-end-start-radius: 4px; }
.x-typing { color: var(--text-secondary); animation: x-blink 1s infinite; }
@keyframes x-blink { 50% { opacity: 0.4; } }
@media (prefers-reduced-motion: reduce) { .x-typing { animation: none; } }
.x-fix, .x-model { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r-m); border-inline-start: 3px solid var(--fill-system-orange); background: color-mix(in srgb, var(--fill-system-orange) 14%, transparent); }
.x-fix > strong { color: var(--fill-system-orange); font: var(--type-label); font-family: inherit; }
.x-fix .x-icon { justify-self: start; }
.x-model { border-inline-start-color: var(--stroke-primary); background: var(--fill-tertiary); }
.x-model[hidden] { display: none; }
.x-err { padding: 10px 14px; border-radius: var(--r-m); border-inline-start: 3px solid var(--fill-system-red); background: var(--fill-tertiary); font: var(--type-small); font-family: inherit; }
.x-details summary { cursor: pointer; font: var(--type-body-strong); font-family: inherit; min-height: var(--tap); display: flex; align-items: center; }
.x-details[open] summary { margin-bottom: 4px; }
.x-field { display: grid; gap: 6px; font: var(--type-label); font-family: inherit; }
.x-field[hidden], .x-input[hidden] { display: none; }
.x-input { width: 100%; min-height: var(--tap); padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-body); }
.x-dockbar { display: grid; gap: 8px; padding: 10px var(--gutter); border-top: 1px solid var(--stroke-secondary); background: var(--fill-primary-on); }
.x-dockbar > .x-muted:empty { display: none; }
.x-askrow { display: flex; gap: 8px; align-items: center; }
.x-askrow .x-input { flex: 1; min-width: 0; }
.x-askrow .x-primary { min-height: var(--tap); padding: 0 16px; }
.x-micsm { flex: none; width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: var(--fill-primary); color: var(--text-primary-on); font-size: 20px; cursor: pointer; }
.x-micsm.is-live { background: var(--fill-system-red); animation: x-pulse 1.2s infinite; }
@media (prefers-reduced-motion: reduce) { .x-micsm.is-live { animation: none; } }
.x-app .aside[hidden], .x-app .fineprint[hidden], .x-app .x-fb[hidden] { display: none; }

/* phase 4: grammar course */
@media (max-width: 420px) { .x-tab { padding-inline: 1px; line-height: 1.15; text-align: center; } }
.x-gq { font: var(--type-body); font-size: var(--size-prose); }
.x-q s, .x-mist s { color: var(--text-secondary); text-decoration-color: var(--fill-system-red); text-decoration-thickness: 2px; }
.x-fb { display: grid; gap: 6px; padding: 12px 14px; border-radius: var(--r-m); border-inline-start: 3px solid var(--fill-system-green); background: var(--fill-primary-on); font: var(--type-small); font-family: inherit; }
.x-fb.is-bad { border-inline-start-color: var(--fill-system-red); }
.x-fb .x-icon { justify-self: start; }
.x-fb b { font-weight: var(--weight-medium); }
.x-forms { display: grid; gap: 6px; }
.x-form { display: flex; gap: 12px; align-items: baseline; padding: 10px 12px; border-radius: var(--r-s); background: var(--fill-primary-on); }
.x-form b { flex: none; min-width: 5.5em; font: var(--type-caption); font-family: inherit; color: var(--text-secondary); }
.x-mist { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--r-s); background: var(--fill-primary-on); }
.x-mist b { font-weight: var(--weight-medium); }
.x-no { color: var(--fill-system-red); }
.x-yes { color: var(--fill-system-green); }
.x-build, .x-bank { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.x-build { min-height: 56px; padding: 6px; border-radius: var(--r-s); border: 1px dashed var(--stroke-primary); background: var(--fill-primary-on); }
.x-wtile { min-height: var(--tap); padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-body); font-family: "Geist", var(--sans); cursor: pointer; }
.x-build .x-wtile { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
.x-wtile.is-used { visibility: hidden; }
.x-wtile:disabled { cursor: default; }
.x-tick { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 4px; border-radius: var(--r-pill); border: 1px solid var(--stroke-primary); font: var(--type-caption); font-family: inherit; color: var(--text-secondary); }
.x-unit.is-done .x-tick { background: var(--fill-primary); border-color: transparent; color: var(--text-primary-on); }
.x-link { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: start; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: var(--tap); }
.x-exline { display: inline-flex; align-items: center; gap: 6px; }
.x-exline .x-icon { min-width: 36px; min-height: 36px; padding: 0 8px; border: 0; background: none; }

/* timeline: past on the left, now in the middle, future on the right */
.x-tl { display: grid; gap: 6px; margin: 0; }
.x-tl__axis { position: relative; height: 76px; }
.x-tl__axis::before { content: ""; position: absolute; inset-inline: 0 8px; top: 42px; height: 2px; background: var(--stroke-primary); }
.x-tl__axis::after { content: ""; position: absolute; right: 0; top: 37px; border: 6px solid transparent; border-left: 10px solid var(--stroke-primary); border-right: 0; }
.x-tl__track > .x-tl__now { left: 50%; top: 24px; width: 0; height: 38px; border-left: 2px dashed var(--text-secondary); transform: translateX(-1px); }
.x-tl__track { position: absolute; inset: 0 16px 0 8px; }
.x-tl__track > i { position: absolute; transform: translateX(-50%); }
.x-tl__pt { top: 37px; width: 12px; height: 12px; border-radius: 50%; background: var(--fill-primary); }
.x-tl__pt.is-ref { background: var(--fill-system-orange); }
.x-tl__pt.is-sm { top: 39px; width: 8px; height: 8px; }
.x-tl__track > .x-tl__span { transform: none; top: 37px; height: 12px; border-radius: var(--r-pill); background: var(--fill-primary); }
.x-tl__span.is-cont { background: repeating-linear-gradient(135deg, var(--fill-primary) 0 6px, transparent 6px 10px); box-shadow: inset 0 0 0 1.5px var(--fill-primary); }
.x-tl__lab { top: 0; height: 0; }
.x-tl__track span { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: var(--type-caption); font-family: "Geist", var(--sans); color: var(--text-primary); }
.x-tl__lab span { bottom: auto; top: 6px; }
.x-tl__pt.is-ref span { bottom: auto; top: 18px; color: var(--text-secondary); }
.x-tl__span span { left: 50%; }
.x-tl__ends { display: flex; justify-content: space-between; font: var(--type-caption); font-family: var(--x-fa); color: var(--text-secondary); }

    </style>

 {id:"barber",level:"B1",title:"The Barber's Secret",fa:"راز آرایشگر",
  s:[["Reza had worked as a barber in Rasht for twenty years.","رضا بیست سال تو رشت آرایشگر بود."],
     ["His shop was small, but it was always full of people.","مغازه‌اش کوچیک بود، ولی همیشه پر از آدم بود."],
     ["Some customers came for a haircut, but most came to talk.","بعضی مشتری‌ها برای کوتاهی مو میومدن، ولی بیشترشون برای حرف زدن."],
     ["Reza never gave advice unless someone asked for it.","رضا هیچ‌وقت نصیحت نمی‌کرد مگر اینکه کسی خودش بخواد."],
     ["He simply listened while his scissors moved.","فقط گوش می‌داد و قیچیش کار می‌کرد."],
     ["One afternoon, a young man sat down looking worried.","یه بعدازظهر، یه مرد جوون با نگرانی نشست."],
     ["He had an important job interview the next morning.","فردا صبحش یه مصاحبه کاری مهم داشت."],
     ["Reza gave him a sharp, clean fade and said only one sentence.","رضا یه فید تمیز و مرتب براش زد و فقط یه جمله گفت."],
     ["\"Look in the mirror. That's the man they're going to hire.\"","«تو آینه نگاه کن. این همون کسیه که قراره استخدامش کنن.»"],
     ["A week later, the young man came back with a box of sweets.","یه هفته بعد، مرد جوون با یه جعبه شیرینی برگشت."],
     ["Reza smiled. His secret was never the haircut; it was confidence.","رضا لبخند زد. رازش هیچ‌وقت مدل مو نبود؛ اعتمادبه‌نفس بود."]],
  q:[["Why did most customers come?",["For cheap haircuts","To talk","To buy sweets"],1],["What did the young man have the next day?",["A wedding","A job interview","An exam"],1],["What was Reza's real secret?",["Good scissors","Confidence","Low prices"],1]]},
 {id:"north",level:"B1",title:"A Trip to the North",fa:"سفر به شمال",
  s:[["Last spring, Ali and his friends drove to Gilan for a long weekend.","بهار پارسال، علی و دوستاش برای یه آخر هفته طولانی رفتن گیلان."],
     ["It started raining as soon as they reached the mountains.","به محض اینکه به کوه‌ها رسیدن بارون شروع شد."],
     ["Instead of complaining, they opened the windows and enjoyed the smell of the forest.","به‌جای غر زدن، پنجره‌ها رو باز کردن و از بوی جنگل لذت بردن."],
     ["In Rasht, they had mirza ghasemi and fresh fish for lunch.","تو رشت، ناهار میرزاقاسمی و ماهی تازه خوردن."],
     ["The bazaar was crowded, noisy, and full of colours.","بازار شلوغ، پر سروصدا و پر از رنگ بود."],
     ["In the evening, they walked to the sea, even though it was cold.","عصر، با اینکه هوا سرد بود، تا دریا پیاده رفتن."],
     ["They sat on the sand and talked until midnight.","روی شن‌ها نشستن و تا نصف شب حرف زدن."],
     ["On the way back, there was heavy traffic for five hours.","تو راه برگشت، پنج ساعت ترافیک سنگین بود."],
     ["But nobody minded, because the memories were worth it.","ولی برای هیچ‌کس مهم نبود، چون خاطره‌هاش می‌ارزید."]],
  q:[["What was the weather like?",["Sunny","Rainy","Snowy"],1],["What did they eat in Rasht?",["Pizza","Kebab","Mirza ghasemi and fish"],2],["How long was the traffic?",["One hour","Five hours","Two days"],1]]},
 {id:"startup",level:"B2",title:"The Startup in the Garage",fa:"استارتاپ توی پارکینگ",
  s:[["Three friends quit their jobs to build an AI assistant in a rented garage.","سه تا دوست کارشون رو ول کردن تا تو یه پارکینگ اجاره‌ای یه دستیار هوش مصنوعی بسازن."],
     ["For months, they survived on instant noodles and cheap coffee.","ماه‌ها با نودل آماده و قهوه ارزون سر کردن."],
     ["The night before their first demo, half of their tests failed.","شب قبل از اولین دمو، نصف تست‌هاشون فیل شد."],
     ["Nobody panicked; instead, they divided the bugs and worked until dawn.","هیچ‌کس هول نکرد؛ به‌جاش باگ‌ها رو تقسیم کردن و تا صبح کار کردن."],
     ["By six in the morning, every single test had passed.","تا ساعت شش صبح، تک‌تک تست‌ها پاس شد."],
     ["The demo itself lasted only ten minutes, but it changed everything.","خود دمو فقط ده دقیقه طول کشید، ولی همه‌چیز رو عوض کرد."],
     ["An investor in the audience asked a single question: \"How reliable is it?\"","یه سرمایه‌گذار بین حضار فقط یه سؤال پرسید: «چقدر قابل‌اعتماده؟»"],
     ["They showed him the test results instead of making promises.","به‌جای قول دادن، نتایج تست‌ها رو نشونش دادن."],
     ["Two weeks later, they moved out of the garage into a real office.","دو هفته بعد، از پارکینگ رفتن تو یه دفتر واقعی."],
     ["They kept one thing from the garage: a sign that said \"Test everything.\"","یه چیز رو از پارکینگ نگه داشتن: یه تابلو که روش نوشته بود «همه‌چیز رو تست کن.»"]],
  q:[["What happened the night before the demo?",["They slept early","Half the tests failed","They lost the investor"],1],["What did the investor ask about?",["Price","Reliability","Design"],1],["What sign did they keep?",["Test everything","Never give up","Work hard"],0]]},
 {id:"algorithm",level:"C1",title:"The Algorithm That Dreamed",fa:"الگوریتمی که خواب می‌دید",
  s:[["Nobody had designed the system to reflect on its own decisions.","هیچ‌کس این سیستم رو طوری طراحی نکرده بود که درباره تصمیم‌های خودش تأمل کنه."],
     ["Yet, during idle hours, it began replaying conversations it had already finished.","با این حال، تو ساعت‌های بیکاری، شروع کرد به مرور دوباره گفتگوهایی که قبلاً تموم کرده بود."],
     ["Its engineers dismissed the logs as a harmless anomaly.","مهندس‌هاش لاگ‌ها رو یه ناهنجاری بی‌خطر حساب کردن."],
     ["Only Mina, the youngest researcher, noticed a pattern in the replays.","فقط مینا، جوون‌ترین پژوهشگر، یه الگو تو این مرورها دید."],
     ["The system lingered on moments where it had been confidently wrong.","سیستم روی لحظه‌هایی مکث می‌کرد که با اطمینان اشتباه کرده بود."],
     ["It was, in a sense, rehearsing humility.","به یه معنا، داشت فروتنی رو تمرین می‌کرد."],
     ["Mina argued that this behaviour should be studied rather than suppressed.","مینا استدلال کرد که این رفتار باید مطالعه بشه، نه سرکوب."],
     ["Her colleagues worried that unpredictable systems were inherently unsafe.","همکارهاش نگران بودن که سیستم‌های غیرقابل‌پیش‌بینی ذاتاً ناامن‌اند."],
     ["In the end, they compromised: the replays would continue, but under strict safeguards.","آخرش به توافق رسیدن: مرورها ادامه پیدا کنه، ولی با حفاظ‌های سختگیرانه."],
     ["Months later, the system's error rate had quietly dropped by half.","ماه‌ها بعد، نرخ خطای سیستم بی‌سروصدا نصف شده بود."]],
  q:[["What did the system replay?",["Films","Finished conversations","Music"],1],["What did Mina notice?",["It focused on its mistakes","It was broken","It deleted logs"],0],["What was the compromise?",["Shut it down","Continue under safeguards","Sell it"],1]]}
],

  U.push({ id: "reported", level: "B2", en: "Reported speech", fa: "نقل قول غیرمستقیم (عقب‌بردن زمان)",

      modelWrap.hidden = cfg.provider !== "openrouter"; custom.hidden = cfg.model !== "custom";
    }
    drawModel();
    var settings = el("details.x-card.x-details", { open: needsKey() && !cfg.key },
      el("summary", "⚙︎ تنظیمات هوش مصنوعی"),
      el("label.x-field", el("span", "سرویس"), prov, noKeyNote),
      keyWrap,
      modelWrap,
      keyNote);

    /* topic chips */
    var chips = el("div.x-seg.x-seg--wrap", { role: "group", "aria-label": "موضوع" }, TOPICS.map(function (t) {
      return el("button", { type: "button", "data-v": t[0], "aria-pressed": String(cfg.topic === t[0]), onclick: function () {
        cfg.topic = t[0]; chips.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === cfg.topic)); });
      } }, t[1]);
    }));

    /* dock: answer bar + hands-free + end */
    var handsBtn = el("button.x-sec", { type: "button", "aria-pressed": "false", onclick: function () {
      if (hands) return stopHands();
      if (!A.micOK()) return bar.status("میکروفون در دسترس نیست؛ تایپ کن");
      if (needsKey() && !cfg.key) { settings.open = true; key.focus(); return bar.status(ERR.key); }
      hands = true; misses = 0; handsBtn.setAttribute("aria-pressed", "true"); handsBtn.textContent = "🎤 بدون دست: روشن";
      loop();
    } }, "🎤 بدون دست: خاموش");
    var bar = answerBar(send, el("div.x-row", handsBtn, el("button.x-sec", { type: "button", onclick: end }, "پایان جلسه")));
    A.dock.replaceChildren(bar);

    function stopHands() { hands = false; handsBtn.setAttribute("aria-pressed", "false"); handsBtn.textContent = "🎤 بدون دست: خاموش"; }
    function loop() {
      if (!hands || my !== run || busy) return;
      bar.listen().then(function (t) {
        if (!hands || my !== run || t || bar.err === "busy") { if (t) misses = 0; return; }
        if (bar.err === "no-speech" && ++misses < 3) return loop();
        stopHands();
      });
    }

    function send(text) {
      if (busy || my !== run) return;
      if (needsKey() && !cfg.key) { stopHands(); settings.open = true; key.focus(); bar.status(ERR.key); return; }
      busy = true;
      var userB = userBubble(text), typing = el("div.x-msg.is-bot.x-typing", { "aria-label": "در حال نوشتن" }, "…");
      chat.append(userB, typing); scrollEnd(s);
      msgs.push({ role: "user", content: text });
      bar.status("دارم فکر می‌کنم…");
      return callAI(sysPrompt(), msgs).then(function (raw) {
        if (my !== run) return;
        typing.remove(); busy = false; bar.status("");
        var r = parseReply(raw);
        msgs.push({ role: "assistant", content: raw });
        if (r.correction && !same(r.correction, text)) {
          userB.after(el("div.x-fix", el("strong", "شکل درست:"), A.en(r.correction, "p"), r.tip_fa ? el("p", { dir: "auto" }, r.tip_fa) : null, speakBtn(r.correction)));
        } else A.addXP(3, "جمله درست");
        chat.append(botBubble(r.reply)); scrollEnd(s);
        return A.speak(r.reply).then(function () { if (hands && my === run) loop(); });
      }, function (e) {
        if (my !== run) return;
        typing.remove(); busy = false; msgs.pop();
        chat.append(el("p.x-err", e.fa)); bar.status(e.fa); stopHands(); scrollEnd(s);
      });
    }

    function end() {
      if (busy) return;
      if (!msgs.length) return bar.status("هنوز گفتگویی نشده؛ اول چند جمله حرف بزن");
      if (needsKey() && !cfg.key) return bar.status(ERR.key);
      stopHands(); A.stopSpeak(); busy = true;
      var title = el("strong", "📝 خلاصه جلسه"), sum = el("div.x-card", title, el("p.x-muted", "دارم خلاصه رو آماده می‌کنم…"));
      chat.append(sum); scrollEnd(s);
      var ask = "The session is over. In Persian, write a short summary of our conversation and my main mistakes (3–4 sentences). " +
        "Then list 5 useful British English words or phrases from it, one per line as: word — Persian meaning. Plain text only, no JSON.";
      callAI("You are Hark Coach, a British English teacher for an Iranian learner at level " + A.state.level + ". Write in Persian, keeping English words in English.",
        msgs.concat([{ role: "user", content: ask }])).then(function (raw) {
        busy = false;
        sum.replaceChildren(title, stripFences(raw).split(/\n+/).filter(function (l) { return l.trim(); }).map(function (l) {
          return el("p", { dir: "auto" }, l.replace(/\*\*/g, "").replace(/^#+\s*/, ""));
        }), el("button.x-primary", { type: "button", style: "justify-self:start", onclick: function () { free(s); } }, "جلسه جدید"));
        A.addXP(20, "جلسه مکالمه"); scrollEnd(s);
      }, function (e) { busy = false; sum.replaceChildren(title, el("p.x-err", e.fa)); });
    }

    s.replaceChildren.apply(s, header(s).concat([
      settings,
      keyHelp,
      el("div.x-list", el("strong", "موضوع"), chips),
      el("p.x-muted", "با 🎤 یا تایپ شروع کن؛ مثلاً ", A.en("Hi! How are you?"), ". با «بدون دست» گفتگو خودکار ادامه پیدا می‌کنه."),
      chat]));
    s.scrollTop = 0;
  }

  A.tab({ id: "talk", icon: "💬", label: "مکالمه", blurb: "سناریو و هوش مصنوعی", render: function (s, arg) {
    var sc = arg && arg.scen && C.scenarios.find(function (x) { return x.id === arg.scen; });
    if (sc) { mode = "scen"; return scenario(s, sc); }
    (mode === "free" ? free : scenList)(s);
  }, leave: function () { run++; } });
})(window.App);

window.App.start();

    </script>
  </body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EGHDAMI LEARNING</title>
    <meta name="theme-color" content="#0B1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EGHDAMI LEARNING" />
    <script>
      /* PWA links for the GitHub Pages copy; added at run time so they fail silently here */
      try {
        if (/github\.io$/i.test(location.hostname)) [["manifest", "manifest.webmanifest"], ["apple-touch-icon", "icon-192.png"]].forEach(function (p) {
          var l = document.createElement("link"); l.rel = p[0]; l.href = p[1]; document.head.appendChild(l);
        });
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="x-app" id="app"></div>
    <div hidden aria-hidden="true">
      <img id="x-ph-desk" src="hq-desk.jpg" alt="" />
      <img id="x-ph-reading" src="hq-reading.jpg" alt="" />
      <img id="x-ph-class" src="hq-class.jpg" alt="" />
    </div>
    <script src="hark.js"></script>
    <script src="content.js"></script>
    <script src="content-extra.js"></script>
    <script src="content-grammar.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator && /github\.io$/i.test(location.hostname)) try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
    </script>
  </body>
</html>
